# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: render.com dashboard -> New -> Blueprint -> connect this repo.
#
# Free tier: no persistent disk, so the SQLite file resets on every
# restart/redeploy (and free services spin down after 15 min idle,
# which counts as a restart). Data is not durable on this plan —
# see .github/workflows/keepalive.yml, which pings the service every
# 10 min to reduce (not eliminate) spin-down/cold-starts.
services:
  - type: web
    name: window-measure
    env: node
    plan: free
    # --include=dev on the client install: NODE_ENV=production (set below)
    # is present during the build too, and npm skips devDependencies under
    # it by default — which is where vite lives. Without this flag the
    # build fails with "vite: not found".
    buildCommand: cd client && npm install --include=dev && npm run build && cd ../server && npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
